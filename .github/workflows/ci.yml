name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm before Node, so setup-node can use the pnpm cache. The version
      # comes from the packageManager field in package.json.
      #
      # These are on their current majors because the runners now force Node 20
      # actions onto Node 24 and warn about it; v4 of each was in that list.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Format check, typecheck and tests. The same command contributors run.
      - run: pnpm check

      # The build is part of CI because two things are only checked there: the
      # hook that strips host_permissions, and the manifest length limits that
      # the Chrome Web Store enforces at upload.
      - run: pnpm zip

      - uses: actions/upload-artifact@v7
        with:
          name: farlink-chrome
          path: build/*.zip
          if-no-files-found: error
